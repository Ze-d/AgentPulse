name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: TypeScript type check
        working-directory: apps/desktop
        run: npx vue-tsc --noEmit

      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Cargo fmt check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-24.04'
            target: 'x86_64-unknown-linux-gnu'
            bundles: 'deb,rpm,appimage'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            bundles: 'nsis,msi'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            bundles: 'dmg,app'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            bundles: 'dmg,app'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and publish
        id: build_publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'AgentPulse ${{ github.ref_name }}'
          releaseBody: 'See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.'
          releaseDraft: true
          prerelease: false
          args: '--target ${{ matrix.target }} --bundles ${{ matrix.bundles }}'

      - name: Verify Windows MSI bundle
        if: runner.os == 'Windows'
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path 'target/*/release/bundle/msi/*.msi' -ErrorAction SilentlyContinue
          if (-not $msi) {
            Write-Error 'Windows release build did not produce an MSI bundle. Ensure the Tauri build requests --bundles nsis,msi and the runner has VBScript/WiX support available.'
            exit 1
          }
          $msi | ForEach-Object { Write-Host "Found MSI bundle: $($_.FullName)" }
