name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-24.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: |
          rm -rf node_modules
          npm install

      - name: Force install native bindings (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm install -D @tailwindcss/oxide-win32-x64-msvc@4.3.0 @rollup/rollup-win32-x64-msvc@4.60.4 lightningcss-win32-x64-msvc@1.32.0
          npm ls @tailwindcss/oxide-win32-x64-msvc
          npm ls @rollup/rollup-win32-x64-msvc
          npm ls lightningcss-win32-x64-msvc

      - name: Force install native bindings (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          npm install -D @tailwindcss/oxide-linux-x64-gnu@4.3.0 @rollup/rollup-linux-x64-gnu@4.60.4 lightningcss-linux-x64-gnu@1.32.0
          npm ls @tailwindcss/oxide-linux-x64-gnu
          npm ls @rollup/rollup-linux-x64-gnu
          npm ls lightningcss-linux-x64-gnu

      - name: Force install native bindings (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          npm install -D @tailwindcss/oxide-darwin-arm64@4.3.0 @rollup/rollup-darwin-arm64@4.60.4 lightningcss-darwin-arm64@1.32.0
          npm ls @tailwindcss/oxide-darwin-arm64
          npm ls @rollup/rollup-darwin-arm64
          npm ls lightningcss-darwin-arm64

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'AgentPulse ${{ github.ref_name }}'
          releaseBody: 'See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.'
          releaseDraft: true
          prerelease: false
          args: '--target ${{ matrix.target }}'
