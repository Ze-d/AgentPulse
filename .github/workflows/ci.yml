name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Cancel redundant runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci --include=optional

      - name: TypeScript type check
        working-directory: apps/desktop
        run: npx vue-tsc --noEmit

      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Python tests
        run: |
          python -m pip install pytest
          python -m pytest tests/

      - name: Cargo fmt check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Cargo audit
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit

      - name: npm audit
        working-directory: apps/desktop
        run: npm audit --audit-level=high
